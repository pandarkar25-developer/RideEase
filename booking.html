<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Vehicle - RideEasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="booking">
<main>

<section class="page-header">
  <p class="hero-eyebrow">Booking</p>
  <h1>Book Your Vehicle</h1>
  <p class="hero-desc">Fill in your details below. We'll calculate your estimated cost automatically.</p>
</section>

<section class="confirmation-box hidden" id="confirmationBox"></section>

<section class="form-section">
  <form class="app-form" id="bookingForm" novalidate>
    <div class="form-grid">
      <div class="form-group">
        <label for="name">Customer Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" placeholder="10-digit mobile number" maxlength="10" required>
        <small class="field-hint" id="mobileHint"></small>
      </div>
      <div class="form-group">
        <label for="vehicle_id">Select Vehicle</label>
        <select id="vehicle_id" required></select>
      </div>
      <div class="form-group">
        <label for="location">Pickup Location</label>
        <input type="text" id="location" placeholder="e.g. Station Road, Aurangabad" required>
      </div>
      <div class="form-group">
        <label for="pickup_date">Pickup Date</label>
        <input type="date" id="pickup_date" required>
      </div>
      <div class="form-group">
        <label for="return_date">Return Date</label>
        <input type="date" id="return_date" required>
      </div>
    </div>
    <div class="cost-estimate">
      <div><span>Rental Duration</span><strong id="durationOut">-- day(s)</strong></div>
      <div><span>Total Estimated Cost</span><strong id="costOut">₹0</strong></div>
    </div>
    <button type="submit" class="btn btn-primary btn-large">Submit Booking</button>
  </form>
</section>
</main>
<script src="js/main.js"></script>
</body>
</html>
